name: Firmware metadata inspector

on:
  pull_request:
    paths:
      - "tools/**"
      - ".github/workflows/firmware-inspector.yml"
  push:
    branches:
      - "backport"
      - "research/mt7902-p2p-capability-audit"
    paths:
      - "tools/**"
      - ".github/workflows/firmware-inspector.yml"

permissions:
  contents: read

jobs:
  firmware-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run firmware parser regression tests
        run: python -m unittest discover -s tools -p 'test_*.py' -v